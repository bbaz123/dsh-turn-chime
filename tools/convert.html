<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><title>converting</title></head>
<body>
<pre id="log">start</pre>
<script>
const log = (m) => { document.getElementById('log').textContent += '\n' + m; };

function encodeWav(audioBuffer) {
  const numCh = audioBuffer.numberOfChannels;
  const sr = audioBuffer.sampleRate;
  const len = audioBuffer.length;
  const bytesPerSample = 2;
  const blockAlign = numCh * bytesPerSample;
  const dataBytes = len * blockAlign;
  const buffer = new ArrayBuffer(44 + dataBytes);
  const view = new DataView(buffer);
  const wstr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF');
  view.setUint32(4, 36 + dataBytes, true);
  wstr(8, 'WAVE');
  wstr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numCh, true);
  view.setUint32(24, sr, true);
  view.setUint32(28, sr * blockAlign, true);
  view.setUint16(32, blockAlign, true);
  view.setUint16(34, 16, true);
  wstr(36, 'data');
  view.setUint32(40, dataBytes, true);
  const chans = [];
  for (let c = 0; c < numCh; c++) chans.push(audioBuffer.getChannelData(c));
  let off = 44;
  for (let i = 0; i < len; i++) {
    for (let c = 0; c < numCh; c++) {
      let s = Math.max(-1, Math.min(1, chans[c][i]));
      view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      off += 2;
    }
  }
  return buffer;
}

(async () => {
  try {
    const ac = new OfflineAudioContext(1, 1, 44100);
    const resp = await fetch('/sound.mp3', { cache: 'no-store' });
    const arr = await resp.arrayBuffer();
    log('mp3 bytes = ' + arr.byteLength);
    const audioBuf = await ac.decodeAudioData(arr);
    log('decoded: ch=' + audioBuf.numberOfChannels + ' sr=' + audioBuf.sampleRate + ' dur=' + audioBuf.duration.toFixed(3));
    const wav = encodeWav(audioBuf);
    log('wav bytes = ' + wav.byteLength);
    const up = await fetch('/wav', { method: 'POST', body: wav });
    log('post = ' + up.status);
  } catch (e) {
    log('ERR ' + e.message);
    try { await fetch('/error', { method: 'POST', body: String(e && e.stack || e) }); } catch (_) {}
  }
})();
</script>
</body>
</html>
